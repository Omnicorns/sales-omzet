<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit Tenant Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<form id="omzetForm" class="w-full max-w-3xl bg-white p-6 rounded-2xl shadow-lg space-y-6">
    <h1 class="text-2xl font-semibold text-gray-800">Submit Tenant Sales</h1>

    <!-- SECTION 1: TOKEN & INFO -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label for="accessToken" class="block text-sm font-medium text-gray-700 mb-1">Access Token</label>
            <input id="accessToken" name="accessToken" type="text" readonly
                   class="w-full border border-gray-300 rounded-lg p-2 bg-gray-100" />
        </div>
        <div class="relative">
            <label for="tenantName" class="block text-sm font-medium text-gray-700 mb-1">Tenant Name</label>
            <div class="relative">
                <input id="tenantName" name="tenantName" type="text"
                       placeholder="Ketik atau pilih tenant"
                       autocomplete="off"
                       class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300" />
                <button type="button" id="tenantToggle"
                        class="absolute inset-y-0 right-0 flex items-center pr-3">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>
            <ul id="tenantDropdown"
                class="absolute top-full left-0 mt-1 w-full bg-white border border-gray-200 rounded-lg shadow-lg max-h-60 overflow-auto z-50 hidden">
                <!-- options via JS -->
            </ul>
        </div>
        <div>
            <label for="brandName" class="block text-sm font-medium text-gray-700 mb-1">Brand Name</label>
            <select id="brandName" name="brandName"
                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-300">
                <option value="" disabled selected>-- Pilih Brand --</option>
                <option>BUMN</option>
                <option>Swasta</option>
            </select>
        </div>
        <div>
            <label for="lotLocation" class="block text-sm font-medium text-gray-700 mb-1">Lot Location</label>
            <input id="lotLocation" name="lotLocation" type="text" placeholder="e.g. Lantai 2 – Unit 25"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300" />
        </div>
    </div>

    <!-- SECTION 2: DATE & DAY -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label for="salesDate" class="block text-sm font-medium text-gray-700 mb-1">Sales Date</label>
            <input id="salesDate" name="salesDate" type="date"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300" />
        </div>
        <div>
            <label for="dayOfWeek" class="block text-sm font-medium text-gray-700 mb-1">Day</label>
            <input id="dayOfWeek" name="day" type="text" readonly
                   class="w-full border border-gray-300 rounded-lg p-2 bg-gray-100" />
        </div>
    </div>

    <!-- SECTION 3: RECEIPTS -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Receipt List</label>
        <div class="overflow-x-auto">
            <table class="w-full table-auto border-collapse">
                <thead>
                <tr class="bg-gray-50">
                    <th class="px-3 py-2">#</th>
                    <th class="px-3 py-2">No. Struk</th>
                    <th class="px-3 py-2">Jumlah</th>
                    <th class="px-3 py-2">Tipe Bayar</th>
                    <th class="px-3 py-2">Tanggal</th>
                    <th class="px-3 py-2"></th>
                </tr>
                </thead>
                <tbody id="receiptRows" class="divide-y"></tbody>
            </table>
        </div>
        <button id="addReceiptBtn" type="button"
                class="mt-3 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300">
            + Add Receipt
        </button>
    </div>

    <!-- SECTION 4: TOTAL & ACTIONS -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="text-lg font-semibold text-gray-800">
            Total: Rp <span id="totalAmount">0</span>
        </div>
        <div class="space-x-2">
            <button type="reset"
                    class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200">Reset</button>
            <button id="submitBtn" type="submit"
                    class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-300">Submit</button>
        </div>
    </div>

    <div id="notification" class="p-3 rounded-lg text-white hidden"></div>
</form>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      const AUTH_CLIENT_ID = '2a210cb2-1808-4b49-9141-0e852610';
      const tenants = [
        'PT.BANK NEGARA INDONESIA (PERSERO),TBK',
        'PT.BANK PEMBANGUNAN DAERAH JAWA BARAT DAN BANTEN,TBK (BANK BJB)',
        'PT BANK PEMBANGUNAN DAERAH LAMPUNG',
        'PT BANK RAKYAT INDONESIA (Persero) Tbk',
        'PT Bank Syariah Indonesia Tbk'
        // ... tambahkan daftar lengkap tenant ...
      ];

      const tenantInput = document.getElementById('tenantName');
      const toggleBtn    = document.getElementById('tenantToggle');
      const dropdown     = document.getElementById('tenantDropdown');
      const accessTokenEl= document.getElementById('accessToken');
      const salesDate    = document.getElementById('salesDate');
      const dayOfWeek    = document.getElementById('dayOfWeek');
      const receiptRows  = document.getElementById('receiptRows');
      const addReceiptBtn= document.getElementById('addReceiptBtn');
      const totalAmount  = document.getElementById('totalAmount');
      const form         = document.getElementById('omzetForm');
      const submitBtn    = document.getElementById('submitBtn');
      const notify       = document.getElementById('notification');

      // Populate dropdown helper
      function renderDropdown(list) {
        dropdown.innerHTML = '';
        list.forEach(name => {
          const li = document.createElement('li');
          li.textContent = name;
          li.className = 'px-3 py-1 hover:bg-gray-100 cursor-pointer';
          li.onclick = () => selectTenant(name);
          dropdown.appendChild(li);
        });
      }
      function selectTenant(name) {
        tenantInput.value = name;
        dropdown.classList.add('hidden');
        fetchAuthToken(name);
      }

      // Toggle full list
      toggleBtn.addEventListener('click', () => {
        if (dropdown.classList.contains('hidden')) {
          renderDropdown(tenants);
          dropdown.classList.remove('hidden');
        } else {
          dropdown.classList.add('hidden');
        }
      });

      // Filter on input
      tenantInput.addEventListener('input', () => {
        const val = tenantInput.value.toLowerCase();
        const filtered = tenants.filter(t => t.toLowerCase().includes(val));
        if (filtered.length) {
          renderDropdown(filtered);
          dropdown.classList.remove('hidden');
        } else {
          dropdown.classList.add('hidden');
        }
      });
      document.addEventListener('click', e => {
        if (!tenantInput.contains(e.target) && !dropdown.contains(e.target) && !toggleBtn.contains(e.target)) {
          dropdown.classList.add('hidden');
        }
      });

      // Fetch authCode and accessToken
      async function fetchAuthToken(tenant) {
        accessTokenEl.value = 'Loading…';
        try {
          const authRes = await fetch('/tenant-sales/authentication/v1/authCode', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ tenantName: tenant, scopes: ['SALES_OMZET'] })
          });
          const { authCode } = await authRes.json();

          const tokenRes = await fetch('/tenant-sales/authentication/v1/applyToken', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ authCode, authClientId: AUTH_CLIENT_ID, grantType: 'AUTHORIZATION_CODE' })
          });
          const { accessToken } = await tokenRes.json();
          accessTokenEl.value = accessToken;
        } catch (err) {
          console.error(err);
          accessTokenEl.value = '';
          alert('Gagal generate access token: ' + err.message);
        }
      }

      // Auto-set date/day
      const today = new Date().toISOString().slice(0,10);
      salesDate.value = today;
      dayOfWeek.value = new Date(today).toLocaleDateString('id-ID',{weekday:'long'});
      salesDate.addEventListener('change', () => {
        const d = new Date(salesDate.value);
        dayOfWeek.value = isNaN(d)?'':d.toLocaleDateString('id-ID',{weekday:'long'});
      });

      // Dynamic receipt rows
      function createRow() {
        const tr = document.createElement('tr');
        tr.className = 'receipt-row';
        tr.innerHTML = `
          <td class="px-3 py-2 row-index"></td>
          <td class="px-3 py-2"><input type="text" name="receiptNumber[]" placeholder="RCPT..." class="w-full p-1 border rounded-lg" required/></td>
          <td class="px-3 py-2"><input type="number" name="amount[]" min="0" step="0.01" class="w-full p-1 border rounded-lg amount-input" required/></td>
          <td class="px-3 py-2">
            <select name="paymentType[]" class="w-full p-1 border rounded-lg"><option>Cash</option><option>QRIS</option><option>Debit</option></select>
          </td>
          <td class="px-3 py-2"><input type="datetime-local" name="receiptDate[]" class="w-full p-1 border rounded-lg" required/></td>
          <td class="px-3 py-2 text-center"><button type="button" class="remove-btn text-red-500 hover:text-red-700">✕</button></td>`;
        tr.querySelector('.remove-btn').onclick = () => { tr.remove(); refresh(); };
        tr.querySelector('.amount-input').oninput = refresh;
        return tr;
      }
      function refresh() {
        let total=0;
        receiptRows.querySelectorAll('tr.receipt-row').forEach((r,i)=>{
          r.querySelector('.row-index').textContent = i+1;
          total += parseFloat(r.querySelector('.amount-input').value)||0;
        });
        totalAmount.textContent = total.toLocaleString('id-ID');
      }
      addReceiptBtn.onclick = () => { receiptRows.appendChild(createRow()); refresh(); };
      addReceiptBtn.click();

      // Form submit
      form.onsubmit = async e => {
        e.preventDefault(); submitBtn.disabled=true; notify.classList.add('hidden');
        const data = new FormData(form);
        const payload={ accessToken:data.get('accessToken'), lotLocation:data.get('lotLocation'), tenantName:data.get('tenantName'), brandName:data.get('brandName'), salesDate:data.get('salesDate'), day:data.get('day'), receiptList:[] };
        receiptRows.querySelectorAll('tr.receipt-row').forEach(r=>payload.receiptList.push({ receiptNumber:r.querySelector('[name="receiptNumber[]"]').value, amount:parseFloat(r.querySelector('[name="amount[]"]').value), paymentType:r.querySelector('[name="paymentType[]"]').value, receiptDate:r.querySelector('[name="receiptDate[]"]').value }));
        try{
          const res=await fetch('/tenant-sales/v1/omzet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          const msg=await res.text();
          if (res.ok) {
  notify.className = 'p-3 rounded-lg bg-green-600 text-white';
  notify.textContent = '✅ Sales berhasil disubmit!';

  form.reset();
  receiptRows.innerHTML = '';
  addReceiptBtn.click();
  salesDate.value = today;
  dayOfWeek.value = new Date(today).toLocaleDateString('id-ID', { weekday: 'long' });

  // Tambahkan ini untuk menghapus notif sukses:
  setTimeout(() => {
    notify.textContent = '';
    notify.classList.add('hidden');
  }, 3000); // notifikasi hilang setelah 3 detik (opsional)
}
          else { notify.className='p-3 rounded-lg bg-red-600 text-white'; notify.textContent=`❌ Error ${res.status}: ${msg}`; }
        } catch(err){ notify.className='p-3 rounded-lg bg-red-600 text-white'; notify.textContent='❌ Network error: '+err.message; }
        finally{ notify.classList.remove('hidden'); submitBtn.disabled=false; }
      };
    });
</script>
</body>
</html>
